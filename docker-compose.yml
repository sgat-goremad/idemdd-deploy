# ============================================================
# docker-compose.yml — Stack de producción (gestionado por Portainer)
#
# No se ejecuta en local: usa imágenes pre-construidas del registry.
# Referencia de variables: .env.example
# ============================================================

name: idemdd

networks:
  # Red compartida donde corre Traefik (debe existir antes)
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

services:
  # ============================================================
  # db — PostgreSQL 16 + PostGIS (acceso remoto en puerto 9006)
  # ============================================================
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: idemdd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-idemdd}
    command: postgres -c listen_addresses='*'
    ports:
      - "${POSTGRES_HOST_PORT:-9006}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-idemdd}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - traefik

  # ============================================================
  # api — WebApi .NET + Tesseract
  # ============================================================
  api:
    image: ${REGISTRY:-ghcr.io/sgat-goremad}/idemdd-backend:${API_TAG:-latest}
    container_name: idemdd-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000

      # BD
      ConnectionStrings__PostgreSQLConnection: >-
        Host=db;
        Port=5432;
        Database=${POSTGRES_DB:-idemdd};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      # JWT
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}

      # OCR
      Ocr__Enabled: ${OCR_ENABLED:-true}
      Ocr__TesseractDataPath: /usr/share/tesseract-ocr/4.00/tessdata/
      Ocr__MaxPagesPerDocument: ${OCR_MAX_PAGES:-10}
      Ocr__MaxCharsPerDocument: ${OCR_MAX_CHARS:-50000}
      Ocr__PerDocumentTimeout: ${OCR_TIMEOUT:-00:02:00}

      # GeoServer (publicación WMS/WFS de vistas SQL).     
      GeoServer__Enabled: ${GEOSERVER_ENABLED:-true}
      GeoServer__BaseUrl: ${GEOSERVER_BASE_URL:-}
      GeoServer__Username: ${GEOSERVER_USERNAME:-}
      GeoServer__Password: ${GEOSERVER_PASSWORD:-}
      GeoServer__WorkspacePrefix: ${GEOSERVER_WORKSPACE_PREFIX:-}
      GeoServer__NamespaceUriTemplate: ${GEOSERVER_NAMESPACE_URI_TEMPLATE:-}
      GeoServer__DatastoreName: ${GEOSERVER_DATASTORE_NAME:-}
      GeoServer__PostgresConnectionString: ${GEOSERVER_POSTGRES_CONNECTION_STRING:-}
      GeoServer__RequestTimeoutSeconds: ${GEOSERVER_REQUEST_TIMEOUT_SECONDS:-30}

      # Storage (archivos digitalizados)
      Storage__RootPath: /app/Storage
    volumes:
      - storage_data:/app/Storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.idemdd-api.loadbalancer.server.port=5000"
      - "traefik.http.routers.idemdd-api.rule=Host(`api.cur.regionmadrededios.gob.pe`)"
      - "traefik.http.routers.idemdd-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.idemdd-api.tls=true"
      - "traefik.http.routers.idemdd-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-ssl}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - traefik

  # ============================================================
  # frontend — React + Vite (nginx)
  # ============================================================
  frontend:
    image: ${REGISTRY:-ghcr.io/sgat-goremad}/idemdd-admin-frontend:${FRONTEND_TAG:-latest}
    container_name: idemdd-frontend
    restart: unless-stopped
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.idemdd-web.loadbalancer.server.port=80"
      - "traefik.http.routers.idemdd-web.rule=Host(`cur.regionmadrededios.gob.pe`)"
      - "traefik.http.routers.idemdd-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.idemdd-web.tls=true"
      - "traefik.http.routers.idemdd-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-ssl}"
    networks:
      - traefik

# ============================================================
# Volúmenes
# ============================================================
volumes:
  postgres_data:
    driver: local
  storage_data:
    driver: local
